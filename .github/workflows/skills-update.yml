# GitHub 消費端 repo 用的可重用 workflow：更新已安裝的技能，有變更就開（或更新）一個
# pull request。它不會推到預設分支——技能以 agent 的完整權限執行，所以由人合併。
#
# 呼叫端（在消費端 repo 的 .github/workflows/skills-update.yml）：
#
#   on:
#     schedule: [{ cron: "0 21 * * 0" }]   # 週一 05:00 Asia/Taipei
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     update:
#       uses: elihu0211/agent-skills/.github/workflows/skills-update.yml@v1
#
# repo 設定「Allow GitHub Actions to create and approve pull requests」必須開啟。
name: skills-update

on:
  workflow_call:
    inputs:
      skills-cli-version:
        description: skills CLI 的版本（npm 套件 "skills"）
        type: string
        default: "1.7.4"
      branch:
        description: 更新要推送到的分支
        type: string
        default: chore/skills-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 更新已安裝的技能
        run: npx --yes "skills@${{ inputs.skills-cli-version }}" update -p -y < /dev/null
      - name: 開啟或更新 pull request
        run: |
          if [ -z "$(git status --porcelain -- .agents skills-lock.json)" ]; then
            echo "技能已是最新。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # 有些 repo 忽略 .agents/、只追蹤 lock 檔；對明確指名的被忽略路徑 git add 會失敗，
          # 所以只有在它被追蹤時才加入。
          git add -A -- skills-lock.json
          git check-ignore -q .agents || git add -A -- .agents
          git commit -m "chore(skills): update shared skills"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "chore(skills): update shared skills" \
              --body "由 skills-update workflow 自動產生。請審查 \`.agents/skills/\` 下的 diff：技能以 agent 的完整權限執行。"
          fi

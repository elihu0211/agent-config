# Reusable workflow for consuming repos on GitHub: refresh installed skills and open
# (or update) a pull request when anything changed. It never pushes to the default
# branch — skills run with the agent's full permissions, so a human merges.
#
# Caller (in the consuming repo, .github/workflows/skills-update.yml):
#
#   on:
#     schedule: [{ cron: "0 21 * * 0" }]   # Monday 05:00 Asia/Taipei
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     update:
#       uses: elihu0211/agent-skills/.github/workflows/skills-update.yml@v1
#
# The repo setting "Allow GitHub Actions to create and approve pull requests" must be on.
name: skills-update

on:
  workflow_call:
    inputs:
      skills-cli-version:
        description: Version of the skills CLI (npm package "skills")
        type: string
        default: "1.7.4"
      branch:
        description: Branch the update is pushed to
        type: string
        default: chore/skills-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Update installed skills
        run: npx --yes "skills@${{ inputs.skills-cli-version }}" update -p -y < /dev/null
      - name: Open or update the pull request
        run: |
          if [ -z "$(git status --porcelain -- .agents skills-lock.json)" ]; then
            echo "Skills are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A .agents skills-lock.json
          git commit -m "chore(skills): update shared skills"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "chore(skills): update shared skills" \
              --body "Automated by the skills-update workflow. Review the diff under \`.agents/skills/\`: skills run with the agent's full permissions."
          fi

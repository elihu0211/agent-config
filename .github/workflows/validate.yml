name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Validate skills and marketplace
        run: uv run scripts/validate.py
      - name: Skills CLI discovers exactly the skills under skills/
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          # The CLI scans the whole repo for SKILL.md; anything outside skills/ (such as
          # the template) would be installable with --skill '*'.
          listed=$(npx --yes skills@1.7.4 add . --list < /dev/null 2>&1 \
            | sed -n 's/^│    \([a-z0-9][a-z0-9-]*\)$/\1/p' | sort)
          expected=$(find skills -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          if [ "$listed" != "$expected" ]; then
            echo "skills CLI lists:"; echo "$listed"
            echo "skills/ contains:"; echo "$expected"
            exit 1
          fi

# GitLab 消費端 repo 用的範本：更新已安裝的技能，有變更就開（或更新）一個合併請求。
# 它不會推到預設分支——技能以 agent 的完整權限執行，所以由人合併。
#
# 這個工作是隱藏的（.skills-update），因為各消費端 repo 的 stage 不同，
# 而只有 .pre/.post 工作的 pipeline 不會執行。消費端設定：
#
#   1. .gitlab-ci.yml:
#        include:
#          - remote: https://raw.githubusercontent.com/elihu0211/agent-skills/v1/ci/skills-update.gitlab-ci.yml
#        skills-update:
#          extends: .skills-update
#          stage: <該 repo 的其中一個 stage>
#   2. CI/CD 變數 SKILLS_UPDATE_TOKEN（masked、protected）：專案存取權杖，
#      角色 Developer、scope write_repository。工作只需要用它搭配 merge_request
#      push 選項推送；受保護的預設分支對它維持關閉。
#   3. 在預設分支建立 pipeline 排程（例如每週），帶變數 SKILLS_UPDATE=true。
#      該 repo 的 workflow:rules 必須允許這條 pipeline。
#   4. 讓該 repo 的其他工作不在這個排程裡跑，例如在每個工作的第一條規則：
#        - if: $SKILLS_UPDATE == "true"
#          when: never

.skills-update:
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SKILLS_UPDATE == "true"
  variables:
    SKILLS_CLI_VERSION: "1.7.4"
    SKILLS_UPDATE_BRANCH: chore/skills-update
    DISABLE_TELEMETRY: "1"
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git
    - npx --yes "skills@${SKILLS_CLI_VERSION}" update -p -y < /dev/null
    - |
      if [ -z "$(git status --porcelain -- .agents skills-lock.json)" ]; then
        echo "技能已是最新。"
        exit 0
      fi
    - test -n "$SKILLS_UPDATE_TOKEN" || { echo "尚未設定 SKILLS_UPDATE_TOKEN"; exit 1; }
    - git config user.name "skills-update"
    - git config user.email "skills-update@${CI_SERVER_HOST}"
    - git checkout -B "$SKILLS_UPDATE_BRANCH"
    # 有些 repo 忽略 .agents/、只追蹤 lock 檔；對明確指名的被忽略路徑 git add 會失敗，
    # 所以只有在它被追蹤時才加入。
    - git add -A -- skills-lock.json
    - git check-ignore -q .agents || git add -A -- .agents
    - git commit -m "chore(skills): update shared skills"
    - >-
      git push --force
      "https://oauth2:${SKILLS_UPDATE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      "HEAD:refs/heads/${SKILLS_UPDATE_BRANCH}"
      -o merge_request.create
      -o "merge_request.target=${CI_DEFAULT_BRANCH}"
      -o merge_request.remove_source_branch
      -o "merge_request.title=chore(skills): update shared skills"
